name: CI

on:
  push:
    branches: [main, v1.0.1]
  pull_request:
    branches: [main, v1.0.1]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # codeExecution 生成式 Python 沙箱的测试可能依赖 python3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (node --test)
        run: npm test

      - name: Architecture guard (size ratchet + red lines)
        run: npm run lint

      - name: Semantic eval L1/L2/L3 (fixture regression)
        run: npm run eval

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yolo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d yolo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      YOLO_PG_TEST_DATABASE: yolo_test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install optional PostgreSQL driver for integration tests
        run: npm install --no-save --package-lock=false pg @playwright/test
      - name: Configure disposable PostgreSQL TLS certificates
        run: bash scripts/setup-postgresql-test-tls.sh '${{ job.services.postgres.id }}'
      - name: Live PostgreSQL integration
        run: node --test tests/postgresql.integration.test.js tests/postgresql.boundaries.test.js tests/postgresql.query.http.test.js
      - name: Install browser for end-to-end acceptance
        run: npx playwright install --with-deps chromium
      - name: Browser datasource acceptance
        env:
          YOLO_BROWSER_TEST: '1'
          YOLO_BROWSER_ARTIFACT_DIR: artifacts/postgresql-browser
        run: node --test tests/postgresql.browser.test.js
      - name: Browser cross-role permission acceptance
        env:
          YOLO_PERMISSION_BROWSER_TEST: '1'
          YOLO_PERMISSION_BROWSER_ARTIFACT_DIR: artifacts/permission-browser
        run: node --test tests/postgresql.permissions.browser.test.js
      - name: Browser Skill catalog acceptance
        env:
          YOLO_SKILL_BROWSER_TEST: '1'
          YOLO_SKILL_BROWSER_ARTIFACT_DIR: artifacts/skill-browser
        run: node --test tests/skillCatalog.browser.test.js
      - name: Browser eval judgment status acceptance
        env:
          YOLO_EVAL_BROWSER_TEST: '1'
        run: node --test tests/evalJudge.browser.test.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postgresql-browser
          path: artifacts/postgresql-browser
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: skill-browser
          path: artifacts/skill-browser
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: permission-browser
          path: artifacts/permission-browser
          if-no-files-found: ignore

  mysql-upload-admission:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: yolo_upload_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      YOLO_MYSQL_UPLOAD_TEST_DATABASE: yolo_upload_test
      YOLO_MYSQL_UPLOAD_TEST_USER: root
      YOLO_MYSQL_UPLOAD_TEST_PASSWORD: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Live MySQL concurrent upload admission
        run: node --test tests/uploadAdmission.mysql.integration.test.js
