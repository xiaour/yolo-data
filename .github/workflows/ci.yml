name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Architecture lint (P0-6)
        run: npm run lint
      - name: Unit + contract tests
        run: npm test
      - name: L1 eval (contract-level)
        run: npm run eval -- --level L1
