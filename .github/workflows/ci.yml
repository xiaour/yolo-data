name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # codeExecution 生成式 Python 沙箱的测试可能依赖 python3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Unit tests (node --test, 213 cases)
        run: npm test

      - name: Architecture guard (size ratchet + red lines)
        run: npm run lint

      - name: Semantic eval L1 (baseline regression)
        run: npm run eval
