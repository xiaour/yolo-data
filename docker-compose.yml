# YOLO Data 一键部署。
# 用法：docker compose up -d
# 完成后访问 http://localhost:8088/ ，默认账号 admin / 口令 yolo123456。
# 默认只绑定本机并启用会话登录；局域网/公网部署请通过反向代理暴露，不要直接改绑 0.0.0.0。
services:
  yolo-data:
    build:
      context: .
      args:
        INSTALL_PG: ${INSTALL_PG:-false}
    image: yolo-data:latest
    container_name: yolo-data
    ports:
      # 左侧仅绑定回环地址，避免默认把未加固实例暴露到局域网或公网。
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8088}:8088"
    environment:
      # 鉴权模式：
      #   dev     —— 内网/本机快速体验。x-user-id 直连且缺省落到管理员，仅限可信网络。
      #   session —— 强制登录会话。对外暴露必须用它（或设 NODE_ENV=production）。
      # ⚠️ NODE_ENV=production 会强制 Secure cookie：若直接以 http://IP:8088 访问
      #    （无 HTTPS），浏览器会丢弃会话 cookie 导致登录死循环。对外场景请在前面挂
      #    HTTPS 反向代理，或把端口只绑 127.0.0.1 由代理转发。详见 README「生产部署注意」。
      AUTH_MODE: ${AUTH_MODE:-session}
      # Codex CLI is included in the image and enabled by default.
      CODEX_RUNTIME_ENABLED: ${CODEX_RUNTIME_ENABLED:-true}
      CODEX_COMMAND: /app/node_modules/.bin/codex
      CODEX_PROVIDER: ${CODEX_PROVIDER:-ollama}
      CODEX_PROVIDER_BASE_URL: ${CODEX_PROVIDER_BASE_URL:-}
      CODEX_PROVIDER_API_KEY: ${CODEX_PROVIDER_API_KEY:-}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-oss:20b}
      # 初始化内置用户时写入的默认口令；生产必须修改（或登录后在账号菜单里改）。
      DEFAULT_USER_PASSWORD: yolo123456
      # 模型服务：留空走本地规则（local-rule），零外部依赖即可启动体验；
      # 填入后切换为真实大模型调用（DeepSeek 或任意 OpenAI 兼容服务）。
      # API_KEY: sk-xxxxxxxx
      # API_BASE_URL: https://api.deepseek.com/v1
      # MODEL: deepseek-chat
      # 外部指标平台（可选）：留空即使用平台集成的本地指标管理，无需外部平台。
      # 内置演示数据（可选）：开启后启动会建表并灌入演示数据，需能连到可达的 MySQL。
      # 详见 config/demo/README.md；演示库用 DEMO_DB_* 指定。
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
    volumes:
      # SQLite 库 / 数据源密钥 / 分析脚本暂存都在这里；删卷 = 清空平台数据。
      - yolo-data:/app/data
      # 配置面：宿主改 yolo-conf.yaml 后 `docker compose restart` 即生效，无需重建镜像。
      # 下面的 environment 优先级更高，机密仍走环境变量。
      - ./yolo-conf.yaml:/app/yolo-conf.yaml:ro
    restart: unless-stopped

volumes:
  yolo-data:
